# Summaries are generated in the bin/jobs process, so development needs an adapter that works across
# processes. The postgresql adapter uses LISTEN/NOTIFY on the primary database: no extra database or Redis.
development:
  adapter: postgresql

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
  writer_batch_size: 4
  writer_batch_delay: 0.001.seconds
